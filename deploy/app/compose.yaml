# Production stack for the VM (reconciled by doco-cd). Dormant until the VM
# exists; the files are valid now. Only Caddy publishes ports; the api service
# stays internal to the compose network. See deploy/README.md for activation.
services:
  api:
    image: ghcr.io/denisolnce/gaias-choice-be:${BE_TAG:-latest}
    restart: unless-stopped
    environment:
      DATA_DIR: /data
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Live-editing seam: without GITHUB_TOKEN, /api/content/* answers 503
      # (CLAUDE.md "Backend"). Editing itself is gated by login — the first
      # admin is created from BOOTSTRAP_ADMIN_* on the first boot with an empty
      # users table (a no-op every boot after). Values come from deploy.env on
      # the VM, never committed. The `:-` keeps compose config renderable when
      # they're absent.
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}
      # Magic-link sign-in email. Live transport: Postmark's HTTP API
      # (POSTMARK_TOKEN + POSTMARK_STREAM). The SMTP_* block stays as the
      # provider-neutral fallback (unused while a token is set). Neither
      # configured ⇒ /api/auth/magic answers 503 (the dialog reports links
      # unavailable). Values live in deploy.env on the VM.
      POSTMARK_TOKEN: ${POSTMARK_TOKEN:-}
      POSTMARK_STREAM: ${POSTMARK_STREAM:-outbound}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-}
      PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-}
      # Telegram sign-in (the primary login). BotFather token; unset ⇒
      # /api/auth/telegram* answer 503 and the dialog falls back to email.
      # Value lives in deploy.env on the VM, never committed.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      # Draft-template enrichment (internal/enrich). Anthropic API key; unset ⇒
      # POST /api/content/template answers 503 and the draft composer keeps the
      # static template. ANTHROPIC_MODEL optionally overrides the default.
      # Value lives in deploy.env on the VM (swept from the root .env), never committed.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
    volumes:
      - /srv/gaias-choice/data:/data # host bind mount, per D9 (boring backups)
    # Readiness gate for doco-cd reconciliation (.doco-cd.yml `reconciliation`).
    # The binary probes /api/healthz (DB round-trip) — distroless has no curl.
    # unhealthy ⇒ doco-cd restarts the container; start_period covers boot+migrate.
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    # Caddyfile edits auto-apply: doco-cd tracks the files each service references
    # (incl. this bind-mounted Caddyfile) and force-recreates caddy when its
    # content changes — no --watch needed (see deploy/infra-log.md "reconcile
    # triggers"). Default image CMD runs caddy; do not override without the
    # `caddy` binary prefix (the image has no entrypoint).
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN} # api.<owner's owned domain>
      # Second site: the village portal's own hostname. The whole host proxies to
      # potok-api:8788 (that container serves its own frontend now). No `:-`
      # default on purpose — an empty value leaves an unnamed Caddy site block
      # and breaks the parse, so a missing var must fail loudly, not silently.
      POTOK_DOMAIN: ${POTOK_DOMAIN}
      # Third and fourth sites: the Porta Pagi landing page and its demo
      # village, bundled on this VM for now (owner, 2026-09-24). Same
      # no-default rule as POTOK_DOMAIN: an empty value breaks the parse.
      PAGI_DOMAIN: ${PAGI_DOMAIN}
      PAGI_DEMO_DOMAIN: ${PAGI_DEMO_DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /srv/gaias-choice/caddy:/data # cert storage survives redeploys
      # The two Porta Pagi sites' access logs (Caddyfile), read by
      # porta-pagi-cloud's `task lens`. Rolled by Caddy, 90 days at most.
      - /srv/gaias-choice/caddy-logs:/var/log/caddy
    # Caddy sits on both networks: the stack's own (api, and potok-api, which
    # joins it from the village's stack) and the Porta Pagi one, so the demo
    # can reach nothing but Caddy — see `pagi` below.
    networks:
      - default
      - pagi

  # The Porta Pagi landing page: a static site in its own image, built by
  # porta-pagi-cloud's CI. Caddy proxies PAGI_DOMAIN to it. Nothing to
  # persist; a roll is a PAGI_SITE_TAG bump in .doco-cd.yml.
  pagi-site:
    image: ghcr.io/denisolnce/porta-pagi-site:${PAGI_SITE_TAG:-latest}
    restart: unless-stopped
    networks:
      - pagi

  # The Porta Pagi demo village: the product's demo image (the door with no
  # code compiled in, wiped and reseeded on the hour). A visitor holds a
  # steward's powers for up to an hour, so it gets no disk: /data is a
  # size-capped tmpfs — the container seeds itself on an empty ground — and
  # the memory is capped. The worst a visitor can do is kill the demo, not
  # fill this box. Beside a village, which the product's docs say never to
  # do; the owner chose it for now (porta-pagi-cloud docs/commercial.md § Decided).
  pagi-demo:
    image: ghcr.io/denisolnce/porta-pagi-demo:${PAGI_DEMO_TAG:-latest}
    restart: unless-stopped
    # Caps, because it shares this box with a village: memory, half a core,
    # and a process count a fork loop cannot pass.
    mem_limit: 384m
    cpus: "0.5"
    pids_limit: 128
    environment:
      DATA_DIR: /data
      PORT: "8788"
      VILLAGE_NAME: Sobreiro Torto
      LANGUAGES: en,pt
      PUBLIC_URL: https://${PAGI_DEMO_DOMAIN}
      PUSH_SUBJECT: https://${PAGI_DEMO_DOMAIN}/
      WEATHER_PROVIDER: open-meteo
      # The seed's contacts are Alentejo (Ourique, Aljustrel); so is the sky.
      WEATHER_COORDS: "37.65,-8.22"
      WEATHER_LOCATION: Sobreiro Torto
      TZ: Europe/Lisbon
      # The feedback chip (porta-pagi feedback.go): emailed through Resend
      # when all three are set in /opt/doco-cd/secrets.env (PASS_ENV), else
      # written to this container's log. Empty is a valid state.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      FEEDBACK_TO: ${FEEDBACK_TO:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
    # Feedback lands in the log until email is wired: keep the log small.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      # nonroot (uid 65532) must write here: a tmpfs is root-owned, hence
      # the mode. 256 MB is many hours of a visitor uploading pictures.
      - type: tmpfs
        target: /data
        tmpfs:
          size: 268435456
          mode: 0o1777
    healthcheck:
      test: ["CMD", "/server", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - pagi

networks:
  # The Porta Pagi services live here and only here. A demo visitor holds a
  # steward's powers for an hour; on the stack's default network that
  # container could name potok-api:8788 and api:8787. On this one it can
  # name Caddy, which is what it needs and all it gets.
  pagi: {}
