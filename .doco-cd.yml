# doco-cd deploy config for the live backend stack (api + caddy). The VM's
# doco-cd polls this repo and reconciles deploy/ on push to main.
#
# Split by sensitivity:
#   - Non-secrets (below) live in git — a public DNS name, a public origin, and
#     the deployed image tag (a public GHCR sha). Bumping BE_TAG here IS the
#     backend release: commit + push, doco-cd redeploys the api. No VM edit.
#   - Secrets are NOT here. They live on the VM in /opt/doco-cd/secrets.env,
#     loaded into the doco-cd container and forwarded into this stack's compose
#     interpolation via PASS_ENV=true on the daemon (${GITHUB_TOKEN}, the
#     BOOTSTRAP_ADMIN_*, POSTMARK/TELEGRAM/ANTHROPIC tokens, …). Phase 3
#     (optional) swaps that for a SOPS+age-encrypted env file committed here.
name: gaias-choice
working_dir: deploy/app
environment:
  API_DOMAIN: gaias-choice.gardenofatlantis.com
  # Second Caddy site: the village portal's own hostname (A record → this VM,
  # created by the village). A public DNS name, so it belongs here, not in
  # secrets.env. Caddy REQUIRES a value — an empty one leaves an unnamed site
  # block, the Caddyfile fails to parse, and the api site goes down with it.
  POTOK_DOMAIN: vas.mokri-potok.si
  # Third and fourth Caddy sites (owner, 2026-09-24): the Porta Pagi landing
  # page and its demo village, both A records → this VM. Public names, so
  # here. The two tags are the images the box runs; both packages must be
  # public on GHCR or compose up fails to pull and the whole stack's
  # reconcile stops — flip them before the first push that names them.
  PAGI_DOMAIN: porta-pagi.gardenofatlantis.com
  PAGI_DEMO_DOMAIN: pp-demo.gardenofatlantis.com
  PAGI_SITE_TAG: sha-0794da35f4b9b39f9fa8cb968631530f46d2311c
  PAGI_DEMO_TAG: sha-f4b564d9d0e59d7f6aa878cd1a5cc02dda2af520
  CORS_ORIGINS: https://denisolnce.github.io
  BE_TAG: sha-6de482c61328bfa0a8d80e8161518b853f0e103f
# Runtime self-healing (doco-cd watches Docker events on this stack's containers):
#   unhealthy → in-place container restart (api's /api/healthz DB probe drives it)
#   die       → full `compose up` reconcile + a [R] Telegram alert on any
#               unexpected exit. Events during our own deploys are suppressed
#               (isStackDeploymentInProgress), so a BE_TAG bump won't self-fire.
# Both send a [R] notification. Exit code isn't in the payload — check `task be:logs`.
reconciliation:
  events: [unhealthy, die]
---
# The controller itself (Layer 0 in git, since 2026-10-08). `name` MUST stay doco-cd:
# the daemon recognises its own container by compose project + service labels, and
# another name starts a SECOND daemon. A bump of deploy/controller/compose.yaml on
# main recreates the controller through the self-update handover (scale_out: the
# successor starts, gets healthy, takes over, removes the old one; ~60 s, no poll
# missed). Before merging such a bump: diff go.mod for compose-go and look at
# internal/source for a layout change — the health gate does not do that.
name: doco-cd
working_dir: deploy/controller
timeout: 120
reconciliation: false
