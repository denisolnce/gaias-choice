# Task runner for Gaia's Choice. https://taskfile.dev
#
# All npm work runs inside a throwaway node:alpine container, and node_modules
# lives in a named Docker volume — nothing touches your host filesystem. This
# mirrors the supply-chain stance in .npmrc / README.
#
# Run `task` (no args) to list everything.
version: '3'

vars:
  NODE_IMAGE: node:22-alpine
  IMAGE: gaias-choice
  PORT: '8080' # nginx serve port for the local prod image (task run)
  DEV_PORT: '5173' # Vite dev server
  VOLUME: gaias-choice-node-modules
  # Backend (Go) settings — same containerized-toolchain stance as the FE.
  GO_IMAGE: golang:1.25-alpine
  BE_PORT: '8787'
  BE_IMAGE: gaias-choice-be
  GO_VOLUME: gaias-choice-go-cache
  # VM connection — the ONE source of truth for host/port/key. The controller
  # scripts (sync.sh, push-secrets.sh) read these from env; the tasks below pass
  # them in, so rotating the port/host/key is a one-place edit here. Port moved
  # off 22 (infra-log hardening). Deploys don't use SSH — they go through
  # git/doco-cd (be:deploy); this is ops-only (be:logs, doco:*).
  VM_HOST: root@gaias-choice.gardenofatlantis.com
  VM_PORT: '13337'
  VM_KEY: ~/.ssh/gaia
  VM_SSH: ssh -p {{.VM_PORT}} -i {{.VM_KEY}} {{.VM_HOST}}
  # Reusable "npm in a container" prefix: repo mounted, workdir frontend/, deps
  # in a volume. content/ stays at repo root (/app/content), reachable from the app.
  NODE_RUN: >-
    docker run --rm -v {{.ROOT_DIR}}:/app -w /app/frontend
    -v {{.VOLUME}}:/app/frontend/node_modules {{.NODE_IMAGE}}
  # Reusable "go in a container" prefix: repo mounted, workdir backend/, module
  # + build cache in a named volume (mirrors NODE_RUN). -buildvcs=false because
  # the container workdir isn't the git root.
  GO_RUN: >-
    docker run --rm -v {{.ROOT_DIR}}:/app -w /app/backend
    -v {{.GO_VOLUME}}:/go -e GOFLAGS=-buildvcs=false {{.GO_IMAGE}}

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list
    silent: true

  deps:
    desc: Install dependencies into the isolated volume (skipped when lockfile is unchanged)
    internal: true
    sources:
      - frontend/package.json
      - frontend/package-lock.json
    generates:
      - .task/deps.done
    cmds:
      - '{{.NODE_RUN}} npm ci --ignore-scripts --no-fund'
      - mkdir -p .task && touch .task/deps.done

  dev:
    desc: Run FE (Vite HMR :5173) and BE (air hot reload :8787) together
    deps: [deps]
    cmds:
      # compose.dev.yaml uses the deps volume (from `deps` above) and the Go
      # cache volume as external — create the Go one if it doesn't exist yet.
      - docker volume create {{.GO_VOLUME}} >/dev/null
      - docker compose -f compose.dev.yaml up

  be:dev:
    desc: Run the backend from source on :8787 (BE-only; combined FE+BE dev is `task dev`)
    cmds:
      - >-
        docker run --rm -it -v {{.ROOT_DIR}}:/app -w /app/backend
        -v {{.GO_VOLUME}}:/go -e GOFLAGS=-buildvcs=false
        -p {{.BE_PORT}}:{{.BE_PORT}} {{.GO_IMAGE}} go run .

  be:test:
    desc: Vet and test the backend in a container
    cmds:
      - '{{.GO_RUN}} sh -c "go vet ./... && go test ./..."'

  be:tidy:
    desc: Sync go.mod/go.sum and verify the module cache (containerized)
    cmds:
      - '{{.GO_RUN}} sh -c "go mod tidy && go mod verify"'

  be:gen:
    desc: Regenerate the OpenAPI server code (backend/internal/httpapi/gen.go) from openapi.yaml
    cmds:
      # Pinned + run-not-imported (like air); only the generated file's small
      # runtime helper package lives in go.mod.
      - '{{.GO_RUN}} go run github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.2 -config oapi-codegen.yaml openapi.yaml'

  be:image:
    desc: Build the production backend Docker image (distroless)
    cmds:
      - docker build -t {{.BE_IMAGE}} backend/

  be:run:
    desc: Build and run the prod backend image locally on :8787 with a data volume
    deps: [be:image]
    cmds:
      - >-
        docker run --rm -p {{.BE_PORT}}:{{.BE_PORT}}
        -v {{.BE_IMAGE}}-data:/data {{.BE_IMAGE}}

  be:tunnel:
    desc: Expose the local backend over ngrok (host tool, as with FE dev)
    cmds:
      - ngrok http {{.BE_PORT}}

  be:verify:
    desc: Backend gate — spec-code sync + vet + test + production image build
    cmds:
      # Contract drift gate: regenerating must be a no-op, or someone edited
      # gen.go by hand / changed the spec without running be:gen.
      - task: be:gen
      - git diff --exit-code -- backend/internal/httpapi/gen.go
      - task: be:test
      - task: be:image

  be:deploy:
    desc: >-
      Roll the VM backend to the latest CI-built image (owner-invoked). GitOps:
      resolves the newest green image sha, bumps BE_TAG in .doco-cd.yml, and
      commits + pushes — doco-cd on the VM reconciles it within ~30s. No SSH/scp.
      Override BE_TAG=sha-… to pin (or roll back to) a specific image.
    cmds:
      - BE_TAG='{{.BE_TAG}}' bash deploy/release.sh

  doco:sync:
    desc: >-
      BOOTSTRAP/REPAIR only since 2026-10-08: push deploy/controller/{compose,poll}.yaml
      to a VM with no (working) controller and start it. The running daemon
      manages its own stack from git now — a controller change is a commit on
      main; this REFUSES while the git-managed daemon runs (FORCE=1 overrides).
      Secrets (secrets.env) stay VM-only — use doco:secrets for those.
    cmds:
      - VM_HOST={{.VM_HOST}} VM_PORT={{.VM_PORT}} VM_KEY={{.VM_KEY}} bash deploy/controller/sync.sh

  doco:secrets:
    desc: >-
      Generate /opt/doco-cd/secrets.env on the VM from the local repo-root .env
      (+ a derived APPRISE_NOTIFY_URLS) and reload the daemon. The ONE
      reproducible path that writes secret VALUES to the VM — values stream over
      ssh into a 0600 file, never a local temp, never git. Run when a secret
      rotates or the notify target (TELEGRAM_CHAT_ID) changes. Override
      VM_HOST/VM_PORT/VM_KEY/ENV_FILE via env.
    cmds:
      - VM_HOST={{.VM_HOST}} VM_PORT={{.VM_PORT}} VM_KEY={{.VM_KEY}} bash deploy/controller/push-secrets.sh

  be:logs:
    desc: >-
      Tail the live VM backend logs. doco-cd runs the stack as project
      gaias-choice (there's no compose file on the host — it clones internally),
      so we read the container directly. SVC=caddy for the edge (default api).
      For the deploy daemon: task be:logs doesn't fit — that's
      `{{.VM_SSH}} 'docker logs -f $(docker ps -q --filter label=com.docker.compose.project=doco-cd --filter label=com.docker.compose.service=doco-cd)'`
      (by label — the name grows per self-update handover). Ctrl-C to stop.
    vars:
      SVC: '{{.SVC | default "api"}}'
    cmds:
      - '{{.VM_SSH}} docker logs -f --tail 200 gaias-choice-{{.SVC}}-1'

  typecheck:
    desc: Strict TypeScript type-check
    deps: [deps]
    cmds:
      - '{{.NODE_RUN}} npm run typecheck'

  build:
    desc: Build the SPA to dist/
    deps: [deps]
    cmds:
      - '{{.NODE_RUN}} npm run build'

  lock:
    desc: Regenerate package-lock.json (isolated, no scripts run)
    cmds:
      - >-
        docker run --rm -v {{.ROOT_DIR}}:/app -w /app/frontend {{.NODE_IMAGE}}
        npm install --package-lock-only --ignore-scripts --no-fund

  audit:
    desc: Audit dependencies for known vulnerabilities
    cmds:
      - >-
        docker run --rm -v {{.ROOT_DIR}}:/app -w /app/frontend {{.NODE_IMAGE}}
        npm audit --audit-level=low

  images:
    desc: Optimize public/images to resized WebP (PNG/JPG in, WebP out, originals removed)
    vars:
      MAGICK: dpokidov/imagemagick:latest
      MAX_DIM: '1400' # shrink-only: images smaller than this are left as-is
      QUALITY: '80'
    cmds:
      - >-
        docker run --rm --entrypoint sh -v {{.ROOT_DIR}}/frontend/public/images:/imgs -w /imgs {{.MAGICK}}
        -c 'for f in *.png *.jpg *.jpeg; do [ -e "$f" ] || continue;
        magick "$f" -resize "{{.MAX_DIM}}x{{.MAX_DIM}}>" -quality {{.QUALITY}}
        -define webp:method=6 "${f%.*}.webp" && rm "$f"; done'
      - 'echo "Remember to reference the .webp files in content/ frontmatter."'

  mandalas:
    desc: 'Generate mandala SVG art for a config set (SET=guides|reviews, optional ONLY=slug1,slug2)'
    vars:
      SET: '{{.SET | default "reviews"}}'
    cmds:
      - '{{.NODE_RUN}} node scripts/generate-mandala.mjs {{.SET}} {{if .ONLY}}--only={{.ONLY}}{{end}}'

  og-cards:
    desc: 'Generate the Compass course social-preview cards (1200x630 JPG, optional ONLY=tag1,tag2)'
    deps: [deps]
    vars:
      MAGICK: dpokidov/imagemagick:latest
      QUALITY: '86'
    cmds:
      # 1) SVG from content (site.yaml epics + themes.yaml palette).
      - '{{.NODE_RUN}} node scripts/generate-og-cards.mjs {{if .ONLY}}--only={{.ONLY}}{{end}}'
      # 2) Rasterize to JPG (scrapers want a raster) and drop the SVGs — the JPGs
      #    are the committed artifact, referenced by entry-server.tsx as og:image.
      #    The SVG delegate in this image is rsvg-convert.
      - >-
        docker run --rm --entrypoint sh -v {{.ROOT_DIR}}/frontend/public/og:/og -w /og {{.MAGICK}}
        -c 'for f in *.svg; do [ -e "$f" ] || continue;
        magick "$f" -quality {{.QUALITY}} "${f%.svg}.jpg" && rm "$f"; done'

  density:
    desc: >-
      Measure Compass chapter content-density (scaffold % + hard facts per
      1,000 core words — a proxy, not a grade). No args scans every course in
      both locales; DIR=<course-tag> or FILE=<path> scans a subset; FLOOR=<n>
      overrides the default 12-facts-per-1k floor; STRICT=1 exits non-zero
      when anything is under the floor.
    cmds:
      - >-
        {{.NODE_RUN}} sh -c
        'DIR={{.DIR}} FILE={{.FILE}} FLOOR={{.FLOOR}} STRICT={{.STRICT}}
        node scripts/check-density.mjs'

  image:
    desc: Build the production Docker image (nginx)
    cmds:
      # Build context is the repo root so the SPA can COPY root-level content/.
      - docker build -f frontend/Dockerfile -t {{.IMAGE}} .

  run:
    desc: Build the image and run it locally (http://localhost:8080)
    deps: [image]
    cmds:
      - docker run --rm -p {{.PORT}}:{{.PORT}} {{.IMAGE}}

  verify:
    desc: Full local check — audit, typecheck, and a production image build
    cmds:
      - task: audit
      - task: typecheck
      - task: image

  clean:
    desc: Remove build output, deps volume, task cache, and the local image
    cmds:
      - rm -rf frontend/dist .task
      - docker volume rm {{.VOLUME}} 2>/dev/null || true
      - docker volume rm {{.GO_VOLUME}} 2>/dev/null || true
      - docker image rm {{.IMAGE}} 2>/dev/null || true
      - docker image rm {{.BE_IMAGE}} 2>/dev/null || true
